name: Build EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name VideoDownloader interfacev1.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-exe
          path: dist/VideoDownloader.exe
